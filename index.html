<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ТК 412</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f6fed">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ТК 412">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f6f4;--card:#fff;--tx:#1b1b1a;--mut:#85857f;--line:#e6e6e1;--ac:#2f6fed;--acbg:#eaf1ff;--warn:#d9480f;--warnbg:#fff1e8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#121212;--card:#1c1c1b;--tx:#ececea;--mut:#8d8d87;--line:#2b2b29;--ac:#6d9cff;--acbg:#17233b;--warn:#ff9c6b;--warnbg:#2c1d14}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#121212;--card:#1c1c1b;--tx:#ececea;--mut:#8d8d87;--line:#2b2b29;--ac:#6d9cff;--acbg:#17233b;--warn:#ff9c6b;--warnbg:#2c1d14}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:480px;margin:0 auto;padding:20px 16px 40px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
h1{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:0}
.wkb{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:99px;padding:4px 12px;font:inherit;font-size:12px;cursor:pointer}
.date{font-size:26px;font-weight:650;margin:0 0 16px}
.chips{display:flex;gap:6px;margin-bottom:16px}
.chip{flex:1;padding:9px 0;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.chip.td{border-color:var(--ac)}
.pair{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.n{font-size:20px;font-weight:650;color:var(--mut);width:18px;flex:none}
.body{flex:1;min-width:0}
.tm{font-size:12px;color:var(--mut);margin-bottom:2px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.s{font-weight:600}.t{font-size:13px;color:var(--mut)}
.r{font-weight:650;color:var(--ac);white-space:nowrap}
.gap{opacity:.55;cursor:default;background:transparent}
.now{border-color:var(--ac);background:var(--acbg)}
.now .tm{color:var(--ac);font-weight:700}
.sub{background:var(--warnbg);border-color:var(--warn)}
.tag{display:block;font-size:12px;font-weight:700;color:var(--warn);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.old{text-decoration:line-through;color:var(--mut);font-size:13px}
.free{color:var(--mut);padding:24px 0;text-align:center}
.box{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.box h2{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:0 0 8px}
.lunch{margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 14px}
summary{cursor:pointer;padding:10px 0;font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}
summary span{display:block;font-weight:400;font-size:12px;color:var(--mut)}
.sec{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:12px 0 4px}
.it{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.it small{color:var(--mut);display:block}
.pr{font-weight:650;white-space:nowrap}
input{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
.btns{display:flex;gap:8px;margin-top:10px}
.btns button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
.btns .pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.hint{font-size:12px;color:var(--mut);margin-top:16px;text-align:center}
</style>
</head>
<body>
<main>
<div class="top"><h1 id="wk"></h1><button class="wkb" id="wb"></button></div>
<div class="date" id="dt"></div>
<div class="chips" id="chips"></div>
<div id="list"></div>
<div id="lunch"></div>
<div class="hint">Нажмите на пару, чтобы добавить замену</div>
</main>
<script>
// [предмет, преподаватель, кабинет, неделя: "в" верхняя / "н" нижняя / пусто — каждую]
var S={
1:{2:[["НСТК","Емельянов Сергей Владимирович","110","н"]],3:[["ТЭС","Бочарова Елена Владимировна","406"]],4:[["ОКМСиУТК","Мацкевич Мария Николаевна","204"]],5:[["ЦиМПУ","Васина Светлана Александровна","407"]]},
2:{2:[["Физ.культура","Шеряков П.В., Терещенко Н.Л.","спортзал"]],3:[["Техн. электрон.","Бедан Елена Михайловна","204"]],4:[["Метр. и сп. изм.","Шевченко Ольга Владимировна","203"]]},
3:{3:[["ОКМСиУТК","Мацкевич Мария Николаевна","204"]],4:[["ТУ СТ","Ерошевич Марина Юрьевна","408"]],5:[["Метр. и сп. изм.","Шевченко Ольга Владимировна","203"]],6:[["Физ.культура","Шеряков П.В., Терещенко Н.Л.","спортзал","в"]]},
4:{2:[["НСТК","Емельянов Сергей Владимирович","110"]],3:[["ОКМСиУТК","Мацкевич Мария Николаевна","116","в"],["Техн. электрон.","Бедан Елена Михайловна","204","н"]],4:[["ОПСиСТ","Шпакова Анна Олеговна","407"]]},
5:{2:[["ЦиМПУ","Васина Светлана Александровна","203"]],3:[["Метр. и сп. изм.","Шевченко Ольга Владимировна","414"]],4:[["ТУ СТ","Ерошевич Марина Юрьевна","408","в"],["ТЭС","Бочарова Елена Владимировна","406","н"]]},
6:{1:[["ТЭС","Бочарова Елена Владимировна","406"]],2:[["НСТК","Емельянов Сергей Владимирович","414"]],3:[["ОПСиСТ","Шпакова Анна Олеговна","407"]]}
};
// время пар в минутах от полуночи
var TW={1:[510,610],2:[620,720],3:[765,865],4:[875,975],5:[985,1085],6:[1095,1195]};
var TS={1:[510,600],2:[615,710],3:[720,815],4:[825,920]};
// снимок меню с clever.by от 22.10.2026: [раздел, [[блюдо, выход, цена]]]
var LUNCH=[
["Салаты",[["Салат «Сытный»","100 г","3,50"],["Винегрет с фасолью","110 г","2,50"],["Салат «Коул слоу»","100/30","3,00"]]],
["Супы",[["Борщ «Украинский» со сметаной, хлебом и салом","250/30/30/60","4,50"],["Бульон из птицы с гренками","250/30/10","2,50"]]],
["Горячие блюда",[["Шницель «По-венски» из свинины с соусом «BBQ»","100/30","5,30"],["Котлета «Папараць-кветка» с чесночным соусом","105/30","4,80"],["Рыба, запечённая с помидором и горчичным соусом","125/30","5,00"]]],
["Гарниры",[["Картофель отварной с зеленью","150 г","2,00"],["Каша овсяная","150 г","2,00"],["Каша перловая с грибами и луком","250 г","2,50"]]]
];
var DN=["Воскресенье","Понедельник","Вторник","Среда","Четверг","Пятница","Суббота"];
var SH=["Пн","Вт","Ср","Чт","Пт","Сб"];
var MO=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
function ld(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function key(d){return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function hm(m){return Math.floor(m/60)+":"+("0"+m%60).slice(-2)}
var now=new Date(),base=new Date(now.getFullYear(),now.getMonth(),now.getDate());
if(base.getDay()===0)base.setDate(base.getDate()+1);
var mon=new Date(base);mon.setDate(base.getDate()-(base.getDay()-1));
var ANCHOR=new Date(2026,9,19); // неделя меняется со вторника: 20–26.10.2026 — нижняя, 27.10–02.11 — верхняя
var sel=base.getDay(),subs=ld("tk412_subs",{}),flip=ld("tk412_flip",0);
function dateOf(w){var d=new Date(mon);d.setDate(mon.getDate()+w-1);return d}
function upper(d){var s=new Date(d);s.setDate(s.getDate()-1);s.setDate(s.getDate()-(s.getDay()+6)%7);return(((Math.round((s-ANCHOR)/6048e5)+flip)%2)+2)%2===1}
function render(){
  var d=dateOf(sel),k=key(d),isToday=k===key(now),up=upper(d),w=up?"в":"н";
  document.getElementById("wk").textContent=isToday?"Сегодня":(k===key(base)&&base.getDay()!==now.getDay()?"Завтра":DN[sel]);
  document.getElementById("dt").textContent=DN[sel]+", "+d.getDate()+" "+MO[d.getMonth()];
  var wb=document.getElementById("wb");wb.textContent=up?"Верхняя неделя":"Нижняя неделя";
  wb.onclick=function(){flip=flip?0:1;sv("tk412_flip",flip);render()};
  var c="";for(var i=1;i<=6;i++){c+='<button class="chip'+(i===sel?" on":"")+(key(dateOf(i))===key(now)&&i!==sel?" td":"")+'" data-d="'+i+'">'+SH[i-1]+"</button>"}
  var ch=document.getElementById("chips");ch.innerHTML=c;
  ch.onclick=function(e){var b=e.target.closest("[data-d]");if(b){sel=+b.dataset.d;render()}};
  var day={},T=sel===6?TS:TW,ds=subs[k]||{},mins=now.getHours()*60+now.getMinutes();
  Object.keys(S[sel]).forEach(function(n){var a=S[sel][n].filter(function(x){return!x[3]||x[3]===w});if(a.length)day[n]=a});
  var all=Object.keys(day).concat(Object.keys(ds)).map(Number),h="";
  if(!all.length){h='<div class="free">Пар нет</div>'}
  else{
    for(var n=Math.min.apply(null,all);n<=Math.max.apply(null,all);n++){
      var it=day[n],sb=ds[n],tt=T[n]?'<div class="tm">'+hm(T[n][0])+"–"+hm(T[n][1])+"</div>":"";
      var cur=isToday&&T[n]&&mins>=T[n][0]&&mins<T[n][1]?" now":"";
      if(sb){
        h+='<div class="pair sub'+cur+'" data-n="'+n+'"><div class="n">'+n+'</div><div class="body">'+tt+'<span class="tag">Замена</span><div class="s">'+esc(sb)+"</div>"+(it?'<div class="old">'+esc(it.map(function(x){return x[0]}).join(", "))+"</div>":"")+"</div></div>";
      }else if(it){
        h+='<div class="pair'+cur+'" data-n="'+n+'"><div class="n">'+n+'</div><div class="body">'+tt;
        it.forEach(function(x){h+='<div class="row"><div><div class="s">'+esc(x[0])+'</div><div class="t">'+esc(x[1])+'</div></div><div class="r">'+esc(x[2])+"</div></div>"});
        h+="</div></div>";
      }else h+='<div class="pair gap"><div class="n">'+n+'</div><div class="body t">окно</div></div>';
    }
  }
  var L=document.getElementById("list");L.innerHTML=h;
  L.onclick=function(e){var p=e.target.closest("[data-n]");if(p)editSub(+p.dataset.n)};
  renderLunch();
}
function editSub(n){
  var k=key(dateOf(sel)),cur=(subs[k]||{})[n]||"",L=document.getElementById("list");
  var box=document.createElement("div");box.className="box";
  box.innerHTML='<h2>Замена на '+n+' паре</h2><input placeholder="Например: ТЭС, каб. 406, или пары нет"><div class="btns"><button class="x">Убрать</button><button class="pri">Сохранить</button></div>';
  L.querySelector('[data-n="'+n+'"]').after(box);
  var inp=box.querySelector("input");inp.value=cur;inp.focus();L.onclick=null;
  function done(v){subs[k]=subs[k]||{};if(v)subs[k][n]=v;else delete subs[k][n];sv("tk412_subs",subs);render()}
  box.querySelector(".pri").onclick=function(){done(inp.value.trim())};
  box.querySelector(".x").onclick=function(){done("")};
}
function renderLunch(){
  var el=document.getElementById("lunch");
  if(sel>5){el.innerHTML="";return}
  var h='<details class="lunch"><summary>Бизнес-ланч · Губернский трактир<span>12:00–15:00 · меню с clever.by от 22.10.2026</span></summary>';
  LUNCH.forEach(function(s){h+='<div class="sec">'+s[0]+"</div>";s[1].forEach(function(x){h+='<div class="it"><div>'+esc(x[0])+"<small>"+esc(x[1])+'</small></div><div class="pr">'+x[2]+" р.</div></div>"})});
  el.innerHTML=h+"</details>";
}
render();
</script>
<script>
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
