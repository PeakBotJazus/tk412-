  box.innerHTML='<h2>'+n+' пара</h2><input class="si" placeholder="Замена: например, ТЭС, каб. 406, или пары нет"><textarea class="ni" rows="2" placeholder="Заметка к паре" style="margin-top:8px"></textarea><div class="t" style="margin:8px 0 4px">Напомнить</div><input type="datetime-local" class="ai"><a class="cal" target="_blank" rel="noopener" style="display:none">Добавить напоминание в календарь</a><div class="btns"><button class="x">Убрать</button><button class="pri">Сохранить</button></div>';
  L.querySelector('[data-n="'+n+'"]').after(box);
  var si=box.querySelector(".si"),ni=box.querySelector(".ni"),ai=box.querySelector(".ai"),cal=box.querySelector(".cal");
  si.value=cur;ni.value=nt.t;ai.value=nt.at||"";L.onclick=null;
  function link(){var v=ai.value;if(!v){cal.style.display="none";return}var a=new Date(v),e=new Date(+a+9e5);cal.href="https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent("ТК 412, "+n+" пара: "+(ni.value||"напоминание"))+"&dates="+fmtD(a)+"/"+fmtD(e)+"&ctz=Europe%2FMinsk";cal.style.display="block"}
  ai.onchange=link;ni.oninput=link;link();
  function done(clear){
    var v=clear?"":si.value.trim(),t=clear?"":ni.value.trim(),q=k+"|"+n;
    subs[k]=subs[k]||{};if(v)subs[k][n]=v;else delete subs[k][n];
    if(t||(!clear&&ai.value)){notes[q]={t:t,at:ai.value};delete seen[q]}else delete notes[q];
    sv("tk412_subs",subs);sv("tk412_notes",notes);sv("tk412_seen",seen);render()}
  box.querySelector(".pri").onclick=function(){done(false)};
  box.querySelector(".x").onclick=function(){done(true)};
}
function remind(){
  var h="",now=new Date();
  Object.keys(notes).forEach(function(q){var x=notes[q],t=x.at&&new Date(x.at);
    if(t&&t<=now&&now-t<1728e5&&!seen[q])h+='<div class="pair sub"><div class="body"><span class="tag">Напоминание · '+q.split("|")[1]+' пара</span><div class="s">'+esc(x.t||"Заметка")+'</div></div><button class="wkb" data-r="'+q+'">Ок</button></div>'});
  var el=document.getElementById("rem");el.innerHTML=h;
  el.onclick=function(e){var b=e.target.closest("button[data-r]");if(b){seen[b.dataset.r]=1;sv("tk412_seen",seen);remind()}};
}
function syncMenu(force){
  if(!API){mst="Сервер не подключён";renderLunch();return}
  mst="Обновляю…";renderLunch();
  fetch(API+"/menu"+(force?"?force=1":"")).then(function(r){return r.text()}).then(function(t){
    var j;try{j=JSON.parse(t)}catch(e){mst="⚠ Сервер не отвечает на /menu. Обновите код воркера в Cloudflare";return}
    if(j.sections&&j.sections.length){
      if(dn(j.updated)>=dn(LUPD)){LUNCH=j.sections.map(function(q){return[q.t,q.items.map(function(x){return[x.n,x.w,x.p,x.d]})]});LUPD=j.updated||LUPD;sv("tk412_menu",{s:LUNCH,u:LUPD})}
      mst=j.stale?"⚠ Сервер не смог обновить меню: "+(j.error||"неизвестная ошибка"):"Проверено в "+pad(new Date().getHours())+":"+pad(new Date().getMinutes())+(j.src?" · "+j.src:"")
    }else mst="⚠ "+(j.error||"Сервер вернул пустое меню")
  }).catch(function(){mst="⚠ Нет связи с сервером"}).then(renderLunch);
}
function sync(){
  if(!API)return;
  fetch(API+"/subs?g="+encodeURIComponent(GROUP)).then(function(r){return r.json()}).then(function(j){remote=j;sv("tk412_remote",j);render()}).catch(function(){});
  syncMenu();
}
function renderLunch(){

{id:"te",t:"Техническая электроника",s:"Рабочая тетрадь 2026 · ЛР 1–9",n0:1,l:["Назначение и возможности Electronic Workbench. Правила ТБ при работе на ПК","Исследование выпрямительного диода","Исследование стабилитрона","Исследование БТ, включённого по схеме с ОБ в статическом режиме","Исследование БТ, включённого по схеме с ОЭ в статическом режиме","Исследование ПТ в статическом режиме","Исследование фотодиода","Исследование оптрона","Исследование БТ, включённого по схеме с ОЭ в нагрузочном режиме"]},
{id:"met",t:"Метрология и специальные измерения",s:"Тетрадь 1 семестра · ЛР 2–14",n0:2,l:["Изучение работы мер и вспомогательных устройств","Изучение работы вольтметров","Изучение работы НЧ измерительного генератора типа «RC»","Изучение работы электронного осциллографа","Измерение сопротивлений заземлений","Измерение параметров сигналов электронным осциллографом","Измерение сопротивлений омметром и мостом постоянного тока","Изучение работы измерительного генератора широкого диапазона частот","Измерение частоты с помощью осциллографа","Изучение работы цифрового частотомера","Измерение амплитудной характеристики четырёхполюсника","Измерение нелинейных искажений методом подавления основной гармоники","Измерение реактивных сопротивлений мостом переменного тока"]},
{id:"tes",t:"Теория электрической связи",s:"Тетрадь 2 семестра · ЛР 7–12",n0:7,l:["Исследование моделей помехоустойчивых блочных кодеров","Исследование умножителя частоты","Исследование LC-автогенератора","Исследование RC-автогенератора","Исследование модели DPSK относительно-фазового модулятора (ОФМ)","Исследование детектора АМ сигналов"]}
];
var lopen=true,labs=ld("tk412_labs",{}),openL={},ex=ld("tk412_ex",{});
function renderLabs(){
  var el=document.getElementById("v-labs"),tot=0,dn=0,h="";
  LABS.forEach(function(q){var d=0;q.l.forEach(function(_,i){if(labs[q.id+":"+(q.n0+i)])d++});q.d=d;tot+=q.l.length;dn+=d});
  h='<h1>Лабораторные работы</h1><div class="date">Сделано '+dn+' из '+tot+'</div><div class="bar"><i style="width:'+(tot?Math.round(dn/tot*100):0)+'%"></i></div>';

    q.l.forEach(function(t,i){var n=q.n0+i,k=q.id+":"+n;h+='<label class="lab"><input type="checkbox" data-k="'+k+'"'+(labs[k]?" checked":"")+"><span><b>№"+n+"</b> "+esc(t)+"</span></label>"});
    h+="</details>"});

// ---------- Стипендия ----------
var HOL=["01-01","01-07","03-08","05-01","05-09","07-03","11-07","12-25"],HOLX=["2026-04-21","2027-05-11","2028-04-25"]; // фикс. праздники РБ и Радуница
function isOff(d){var w=d.getDay(),m=pad(d.getMonth()+1)+"-"+pad(d.getDate());return w===0||w===6||HOL.indexOf(m)>=0||HOLX.indexOf(d.getFullYear()+"-"+m)>=0}
function payDay(y,m){var d=new Date(y,m,21);while(isOff(d))d.setDate(d.getDate()-1);return d}
function pl(n,a,b,c){var m=n%10,h=n%100;return m===1&&h!==11?a:(m>=2&&m<=4&&(h<10||h>=20)?b:c)}
function dm(d){return d.getDate()+" "+MO[d.getMonth()]}
function renderStip(){
  var t=new Date(now.getFullYear(),now.getMonth(),now.getDate()),list=[];
  for(var k=0;list.length<4&&k<16;k++){var d=payDay(t.getFullYear(),t.getMonth()+k);if(d>=t)list.push(d)}
  var nx=list[0],pv=payDay(nx.getFullYear(),nx.getMonth()-1),n=Math.round((nx-t)/864e5),pr=Math.round((t-pv)/(nx-pv)*100);
  var orig=new Date(nx.getFullYear(),nx.getMonth(),21);
  var h='<h1>'+W("Стипендия")+'</h1><div class="hero"><div class="num">'+(n===0?(cfg.hw?"🎃":"🎉"):n)+'</div><div class="lbl">'+(n===0?W("Стипендия")+" сегодня":pl(n,"день","дня","дней")+(cfg.cc?" до Лас Вегаса":" до стипендии"))+'</div><div class="t" style="margin-top:6px">'+DN[nx.getDay()].toLowerCase()+", "+dm(nx)+"</div></div>";
  h+='<div class="bar"><i style="width:'+Math.max(0,Math.min(100,pr))+'%"></i></div>';
  if(nx.getDate()!==21)h+='<div class="pair sub" style="cursor:default"><div class="body"><span class="tag">Выплата раньше</span><div class="s">21 '+MO[orig.getMonth()]+" — "+DN[orig.getDay()].toLowerCase()+(isOff(orig)&&orig.getDay()%6!==0?" (праздник)":"")+", поэтому деньги придут "+dm(nx)+"</div></div></div>";
  h+='<div class="box"><h2>Ближайшие выплаты</h2>';
  list.forEach(function(d){var c=Math.round((d-t)/864e5);h+='<div class="pay"><span>'+dm(d)+' <span class="t">· '+DN[d.getDay()].toLowerCase()+'</span></span><b>'+(c===0?"сегодня":c+" дн.")+"</b></div>"});
  document.getElementById("v-stip").innerHTML=h+'</div><div class="hint">Выплата 21-го числа. Если оно выходной или праздник, считается предыдущий рабочий день. Переносы рабочих дней не учитываются.</div>';
}

{id:"w",t:"Зимняя сессия",def:"2027-01-05",sub:"начало по графику образовательного процесса",ex:[["tes","ТЭС"],["cimpu","ЦиМПУ"]]},

];
function daysTo(v){var t=new Date(now.getFullYear(),now.getMonth(),now.getDate());return Math.round((new Date(v+"T00:00:00")-t)/864e5)}
function cdText(n){return n>0?"через "+n+" "+pl(n,"день","дня","дней"):n===0?"сегодня":Math.abs(n)+" "+pl(Math.abs(n),"день","дня","дней")+" назад"}
function renderExam(){

    q.ex.forEach(function(e){var k=q.id+":"+e[0],d=ex[k];h+='<div class="ex"><div><b>'+e[1]+'</b><div class="t">'+(d?cdText(daysTo(d)):"дата пока неизвестна")+'</div></div><input type="date" data-e="'+k+'" value="'+(d||"")+'"></div>'});

}
